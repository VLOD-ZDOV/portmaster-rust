name: CI

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core-linux:
    name: Rust Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p pm-core --bin portmaster-core-rs

      - name: Package Linux artifact
        run: |
          mkdir -p dist
          cp target/release/portmaster-core-rs dist/portmaster-core-rs-linux-amd64
          chmod +x dist/portmaster-core-rs-linux-amd64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmaster-core-rs-linux-amd64
          path: dist/portmaster-core-rs-linux-amd64

  rust-core-windows:
    name: Rust Core (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p pm-core --bin portmaster-core-rs

      - name: Package Windows artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/portmaster-core-rs.exe dist/portmaster-core-rs-windows-amd64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmaster-core-rs-windows-amd64
          path: dist/portmaster-core-rs-windows-amd64.exe

  go-core:
    name: Go Core (Linux & Windows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26'
          cache: true

      - name: Build Go core Linux
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/portmaster-core-go-linux-amd64 ./cmds/portmaster-core

      - name: Build Go core Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/portmaster-core-go-windows-amd64.exe ./cmds/portmaster-core

      - name: Upload Go artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portmaster-core-go
          path: dist/portmaster-core-go*

  angular-ui:
    name: Angular UI Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/angular
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: desktop/angular/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build shared libraries
        run: npm run build-libs

      - name: Build Angular app
        run: npx ng build --configuration production --base-href /ui/modules/portmaster/ portmaster

      - name: Package portmaster.zip
        run: |
          cd dist
          zip -r ../../../portmaster.zip .

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmaster-ui
          path: portmaster.zip

      - name: Build Tauri builtin UI
        run: npx ng build --configuration production --base-href / tauri-builtin

      - name: Upload Tauri builtin UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-builtin-dist
          path: desktop/angular/dist/tauri-builtin

  tauri-ui-linux:
    name: Tauri Tray App (Linux)
    needs: [angular-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK / WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri

      - name: Download Tauri builtin UI
        uses: actions/download-artifact@v4
        with:
          name: tauri-builtin-dist
          path: desktop/angular/dist/tauri-builtin

      - name: Build Tauri tray app
        run: cargo build --release --manifest-path desktop/tauri/src-tauri/Cargo.toml --features custom-protocol

      - name: Package Linux tray binary
        run: |
          mkdir -p dist
          cp desktop/tauri/src-tauri/target/release/portmaster dist/portmaster-app-linux-amd64
          chmod +x dist/portmaster-app-linux-amd64

      - name: Upload Linux tray artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmaster-app-linux-amd64
          path: dist/portmaster-app-linux-amd64

  tauri-ui-windows:
    name: Tauri Tray App (Windows)
    needs: [angular-ui]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri

      - name: Download Tauri builtin UI
        uses: actions/download-artifact@v4
        with:
          name: tauri-builtin-dist
          path: desktop/angular/dist/tauri-builtin

      - name: Build Tauri tray app
        run: cargo build --release --manifest-path desktop/tauri/src-tauri/Cargo.toml --features custom-protocol

      - name: Package Windows tray binary
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/tauri/src-tauri/target/release/portmaster.exe dist/portmaster-app-windows-amd64.exe

      - name: Upload Windows tray artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmaster-app-windows-amd64
          path: dist/portmaster-app-windows-amd64.exe

  rust-wasm-ui:
    name: Rust WASM UI Bundle (Leptos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/rust-ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain & wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install Tailwind CSS v4 CLI
        shell: bash
        run: |
          mkdir -p "${HOME}/.local/bin"
          if ! curl -fsSL https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64 -o "${HOME}/.local/bin/tailwindcss"; then
            npm install -g @tailwindcss/cli
          else
            chmod +x "${HOME}/.local/bin/tailwindcss"
          fi
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/rust-ui

      - name: Build Rust WASM UI (release)
        run: trunk build --release --dist dist

      - name: Package rust-ui.zip
        run: |
          cd dist
          zip -r ../../../rust-ui.zip .

      - name: Upload Rust WASM UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-ui
          path: rust-ui.zip

  qt-ui-linux:
    name: Qt 6 Native UI (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 6 & CMake dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-websockets-dev \
            libgl1-mesa-dev

      - name: Configure and build Qt 6 QML UI
        run: |
          cmake -B build-qt -S desktop/qt-ui -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-qt -j$(nproc)

      - name: Package Linux Qt binary
        run: |
          mkdir -p dist
          cp build-qt/portmaster-qt dist/portmaster-qt-linux-amd64
          chmod +x dist/portmaster-qt-linux-amd64

      - name: Upload Linux Qt artifact
        uses: actions/upload-artifact@v4
        with:
          name: portmaster-qt-linux-amd64
          path: dist/portmaster-qt-linux-amd64

  release:
    name: Publish Release Assets
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [rust-core-linux, rust-core-windows, go-core, angular-ui, rust-wasm-ui, qt-ui-linux, tauri-ui-linux, tauri-ui-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare release files and checksums
        run: |
          mkdir -p dist
          cp release-artifacts/portmaster-core-rs-linux-amd64 dist/portmaster-core-rs
          chmod +x dist/portmaster-core-rs
          cp release-artifacts/portmaster-core-rs-windows-amd64.exe dist/portmaster-core-rs.exe
          cp release-artifacts/portmaster-core-go-linux-amd64 dist/portmaster-core-go
          chmod +x dist/portmaster-core-go
          cp release-artifacts/portmaster-core-go-windows-amd64.exe dist/portmaster-core-go.exe
          cp release-artifacts/portmaster-app-linux-amd64 dist/portmaster-app-linux-amd64
          chmod +x dist/portmaster-app-linux-amd64
          cp release-artifacts/portmaster-app-windows-amd64.exe dist/portmaster-app-windows-amd64.exe
          cp release-artifacts/portmaster-qt-linux-amd64 dist/portmaster-qt-linux-amd64
          chmod +x dist/portmaster-qt-linux-amd64
          cp release-artifacts/portmaster.zip dist/portmaster.zip
          cp release-artifacts/rust-ui.zip dist/rust-ui.zip
          (cd assets/data && zip -r ../../dist/assets.zip .)
          (cd pilot/leptos/web && zip -r ../../../dist/pilot-web.zip .)
          cp scripts/patch-portmaster.sh dist/patch-portmaster.sh
          cp scripts/patch-portmaster.ps1 dist/patch-portmaster.ps1
          cd dist
          sum="shasum -a 256"; command -v sha256sum >/dev/null && sum=sha256sum
          for f in *; do
            if [ -f "$f" ]; then
              $sum "$f" > "$f.sha256"
            fi
          done
          CORE_VER=$(grep 'pub const PORTMASTER_VERSION' ../crates/pm-core/src/service.rs | cut -d '"' -f 2)
          echo "RELEASE_VERSION=${CORE_VER:-2.2.11}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.RELEASE_VERSION) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Portmaster {0}', github.ref_name) || format('Portmaster v{0}', env.RELEASE_VERSION) }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
