<div
  class="relative flex flex-wrap items-center justify-center w-full h-full gap-2 px-3 py-2 bg-gray-300 border border-gray-300 rounded shadow"
  snfgTooltipPosition="right"
  [sfng-tooltip]="interferingSettings.length > 0 ? tooltipTemplate : null">
  <span class="text-primary font-medium" [class.cursor-pointer]="interferingSettings.length > 0">
    {{ 'app.useVPN' | t: undefined : ('' | i18nVersion) }}
  </span>

  <div class="inline-flex overflow-hidden border border-gray-500 rounded bg-gray-200 text-xxs">
    <button type="button" (click)="setMode('default')"
      class="px-2 py-0.5 transition-colors cursor-pointer"
      [ngClass]="mode === 'default' ? 'bg-blue text-white font-medium' : 'text-secondary hover:text-primary'">
      {{ 'app.routingDefault' | t: undefined : ('' | i18nVersion) }} ({{ (defaultValue ? 'app.routingVpn' : 'app.routingDirect') | t: undefined : ('' | i18nVersion) }})
    </button>
    <button type="button" (click)="setMode('vpn')"
      class="px-2 py-0.5 transition-colors cursor-pointer border-l border-gray-500"
      [ngClass]="mode === 'vpn' ? 'bg-blue text-white font-medium' : 'text-secondary hover:text-primary'">
      {{ 'app.routingVpn' | t: undefined : ('' | i18nVersion) }}
    </button>
    <button type="button" (click)="setMode('direct')"
      class="px-2 py-0.5 transition-colors cursor-pointer border-l border-gray-500"
      [ngClass]="mode === 'direct' ? 'bg-gray-500 text-primary font-medium' : 'text-secondary hover:text-primary'">
      {{ 'app.routingDirect' | t: undefined : ('' | i18nVersion) }}
    </button>
  </div>

  <span class="text-xs text-tertiary" *ngIf="spnDisabled"
    [sfng-tooltip]="'app.enableSPNUse' | t: undefined : ('' | i18nVersion)">
    ({{ 'common.offline' | t: undefined : ('' | i18nVersion) }})
  </span>

  <span class="absolute right-0 block w-2 h-2 bg-yellow-300 border border-gray-100 rounded opacity-75"
    style="top: 2px; transform: translateX(-2px)" *ngIf="interferingSettings.length > 0"></span>

</div>

<ng-template #tooltipTemplate>
  {{ 'app.interfering' | t: undefined : ('' | i18nVersion) }}
  <ul class="pl-4 list-disc">
    <ng-container *ngFor="let setting of interferingSettings">
      <li class="cursor-pointer hover:underline" [routerLink]="[]"
        [queryParams]="{setting: setting.Key, tab: 'settings'}">
        {{ setting.Name }}
      </li>
    </ng-container>
  </ul>
</ng-template>
